name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download ffmpeg (sidecar)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-tmp"
          $bin   = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffmpeg.exe"  | Select-Object -First 1
          $probe = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item $bin.FullName   "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          Copy-Item $probe.FullName "src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe"
          Write-Host "ffmpeg: $((Get-Item 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe').Length) bytes"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TAURI_CONFIG: '{"bundle":{"externalBin":["binaries/ffmpeg","binaries/ffprobe"]}}'

      - name: Verify installer contains ffmpeg
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"
          Write-Host "=== Archivos en el instalador ==="
          & "C:\Program Files\7-Zip\7z.exe" l $installer.FullName 2>&1 | Write-Host
          Write-Host "=== Buscando ffmpeg ==="
          & "C:\Program Files\7-Zip\7z.exe" l $installer.FullName 2>&1 | Select-String -Pattern "ffmpeg|ffprobe" | Write-Host

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Download ffmpeg static
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p src-tauri/binaries
          cp ffmpeg-*-amd64-static/ffmpeg  src-tauri/binaries/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe src-tauri/binaries/ffprobe
          chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Patch AppImage (bundle ffmpeg + fix AppRun)
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          echo "Patching $APPIMAGE"

          # Extraer AppImage (comillas para manejar espacios en el nombre)
          "$APPIMAGE" --appimage-extract

          # Copiar ffmpeg al AppDir
          cp src-tauri/binaries/ffmpeg  squashfs-root/usr/bin/ffmpeg
          cp src-tauri/binaries/ffprobe squashfs-root/usr/bin/ffprobe
          chmod +x squashfs-root/usr/bin/ffmpeg squashfs-root/usr/bin/ffprobe

          # El AppRun de Tauri es un BINARIO compilado, no un script.
          # Parchear con sed lo corrompía. Solución: renombrarlo a AppRun.real
          # y crear un wrapper shell que setea las variables y lo llama intacto.
          echo "--- Tipo de AppRun original ---"
          file squashfs-root/AppRun
          mv squashfs-root/AppRun squashfs-root/AppRun.real
          chmod +x squashfs-root/AppRun.real
          printf '#!/bin/bash\n# Wayland/EGL fixes — llama al AppRun original de Tauri\nunset WAYLAND_DISPLAY\nexport GDK_BACKEND=x11\nexport WEBKIT_DISABLE_DMABUF_RENDERER=1\nAPPDIR="$(dirname "$(readlink -f "$0")")"\nexport PATH="$APPDIR/usr/bin:$PATH"\nexec "$APPDIR/AppRun.real" "$@"\n' > squashfs-root/AppRun
          chmod +x squashfs-root/AppRun
          echo "--- AppRun wrapper ---"
          cat squashfs-root/AppRun

          # Reempaquetar con appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root TheFoundry_App-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Linux
          path: TheFoundry_App-x86_64.AppImage
          retention-days: 30
