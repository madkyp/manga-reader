name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-tmp"
          $bin   = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffmpeg.exe"  | Select-Object -First 1
          $probe = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item $bin.FullName   "src-tauri/resources/ffmpeg.exe"
          Copy-Item $probe.FullName "src-tauri/resources/ffprobe.exe"
          Write-Host "ffmpeg:  $((Get-Item 'src-tauri/resources/ffmpeg.exe').Length) bytes"
          Write-Host "ffprobe: $((Get-Item 'src-tauri/resources/ffprobe.exe').Length) bytes"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          Set-Content -Path "src-tauri/resources-override.json" -Value '{"bundle":{"resources":["resources/ffmpeg.exe","resources/ffprobe.exe"]}}' -Encoding UTF8
          npm run tauri build -- --bundles nsis --config src-tauri/resources-override.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Verify installer size (debe ser >100 MB con ffmpeg)
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.FullName) — $mb MB"
          if ($installer.Length -lt 50MB) {
            Write-Error "FALLO: el instalador es demasiado pequeño ($mb MB) — ffmpeg no fue incluido"
            exit 1
          }
          Write-Host "OK: ffmpeg incluido (tamaño razonable)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Download ffmpeg static
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p src-tauri/binaries
          cp ffmpeg-*-amd64-static/ffmpeg  src-tauri/binaries/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe src-tauri/binaries/ffprobe
          chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Patch AppImage (bundle ffmpeg + fix AppRun)
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          echo "Patching $APPIMAGE"

          # Extraer AppImage (comillas para manejar espacios en el nombre)
          "$APPIMAGE" --appimage-extract

          # Copiar ffmpeg al AppDir
          cp src-tauri/binaries/ffmpeg  squashfs-root/usr/bin/ffmpeg
          cp src-tauri/binaries/ffprobe squashfs-root/usr/bin/ffprobe
          chmod +x squashfs-root/usr/bin/ffmpeg squashfs-root/usr/bin/ffprobe

          # El AppRun de Tauri es un BINARIO compilado, no un script.
          # Parchear con sed lo corrompía. Solución: renombrarlo a AppRun.real
          # y crear un wrapper shell que setea las variables y lo llama intacto.
          echo "--- Tipo de AppRun original ---"
          file squashfs-root/AppRun
          mv squashfs-root/AppRun squashfs-root/AppRun.real
          chmod +x squashfs-root/AppRun.real
          printf '#!/bin/bash\n# Forzar XWayland — la libEGL de Ubuntu 22.04 no es compatible con Wayland nativo moderno\nunset WAYLAND_DISPLAY\nexport GDK_BACKEND=x11\nexport WEBKIT_DISABLE_DMABUF_RENDERER=1\nexport LIBGL_ALWAYS_SOFTWARE=1\nexport MESA_LOADER_DRIVER_OVERRIDE=swrast\nAPPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"\nexport PATH="$APPDIR/usr/bin:$PATH"\nexec "$APPDIR/AppRun.real" "$@"\n' > squashfs-root/AppRun
          chmod +x squashfs-root/AppRun
          echo "--- AppRun wrapper ---"
          cat squashfs-root/AppRun

          # Reempaquetar con appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root TheFoundry_App-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Linux
          path: TheFoundry_App-x86_64.AppImage
          retention-days: 30
