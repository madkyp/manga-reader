name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-tmp"
          $bin   = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffmpeg.exe"  | Select-Object -First 1
          $probe = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item $bin.FullName   "src-tauri/binaries/ffmpeg.exe"
          Copy-Item $probe.FullName "src-tauri/binaries/ffprobe.exe"
          $ffmpegDir = (Resolve-Path "src-tauri/binaries").Path
          $nsiPath = "src-tauri/nsis/extra.nsi"
          "!macro customInstall"                              | Set-Content  $nsiPath -Encoding UTF8
          "  SetOutPath `"`$INSTDIR`""                       | Add-Content  $nsiPath -Encoding UTF8
          "  File `"$ffmpegDir\ffmpeg.exe`""                 | Add-Content  $nsiPath -Encoding UTF8
          "  File `"$ffmpegDir\ffprobe.exe`""                | Add-Content  $nsiPath -Encoding UTF8
          "!macroend"                                         | Add-Content  $nsiPath -Encoding UTF8
          "!macro customUnInstall"                            | Add-Content  $nsiPath -Encoding UTF8
          "!macroend"                                         | Add-Content  $nsiPath -Encoding UTF8

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Download ffmpeg static
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p src-tauri/binaries
          cp ffmpeg-*-amd64-static/ffmpeg  src-tauri/binaries/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe src-tauri/binaries/ffprobe
          chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Patch AppImage (bundle ffmpeg + fix AppRun)
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          echo "Patching $APPIMAGE"

          # Extraer AppImage
          $APPIMAGE --appimage-extract

          # Copiar ffmpeg al AppDir
          cp src-tauri/binaries/ffmpeg  squashfs-root/usr/bin/ffmpeg
          cp src-tauri/binaries/ffprobe squashfs-root/usr/bin/ffprobe
          chmod +x squashfs-root/usr/bin/ffmpeg squashfs-root/usr/bin/ffprobe

          # AppRun personalizado con fixes de Wayland/GPU
          cat > squashfs-root/AppRun << 'APPRUN'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          # Fixes para Wayland y drivers modernos
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          # ffmpeg bundleado
          export PATH="$APPDIR/usr/bin:$PATH"
          exec "$APPDIR/usr/bin/app" "$@"
          APPRUN
          chmod +x squashfs-root/AppRun

          # Reempaquetar con appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root TheFoundry_App-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Linux
          path: TheFoundry_App-x86_64.AppImage
          retention-days: 30
