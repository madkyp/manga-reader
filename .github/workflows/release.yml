name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-tmp"
          $bin   = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffmpeg.exe"  | Select-Object -First 1
          $probe = Get-ChildItem "ffmpeg-tmp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item $bin.FullName   "src-tauri/resources/ffmpeg.exe"
          Copy-Item $probe.FullName "src-tauri/resources/ffprobe.exe"
          Write-Host "ffmpeg:  $([math]::Round((Get-Item 'src-tauri/resources/ffmpeg.exe').Length/1MB,1)) MB"
          Write-Host "ffprobe: $([math]::Round((Get-Item 'src-tauri/resources/ffprobe.exe').Length/1MB,1)) MB"

      - name: Download mpv
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{"User-Agent"="CI"}
          $asset   = $release.assets | Where-Object { $_.name -match "^mpv-x86_64-\d+-git-[a-f0-9]+\.7z$" } | Select-Object -First 1
          Write-Host "Descargando $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv.7z"
          7z e mpv.7z mpv.exe d3dcompiler_43.dll -o"src-tauri/resources/" -y
          Write-Host "mpv.exe: $([math]::Round((Get-Item 'src-tauri/resources/mpv.exe').Length/1MB,1)) MB"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Verify installer (debe incluir ffmpeg + mpv)
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.Name) — $mb MB"
          if ($installer.Length -lt 150MB) {
            Write-Error "FALLO: instalador demasiado pequeño ($mb MB) — faltan binarios"
            exit 1
          }
          Write-Host "OK: ffmpeg + mpv incluidos"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git base-devel curl wget file pkg-config \
            nodejs npm \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            patchelf \
            fuse2 \
            openssl

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download ffmpeg static
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mkdir -p src-tauri/binaries
          cp ffmpeg-*-amd64-static/ffmpeg  src-tauri/binaries/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe src-tauri/binaries/ffprobe
          chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: |
          source $HOME/.cargo/env
          npm run tauri build -- --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Patch AppImage (bundle ffmpeg + forzar X11)
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          echo "Patching $APPIMAGE"
          "$APPIMAGE" --appimage-extract

          cp src-tauri/binaries/ffmpeg  squashfs-root/usr/bin/ffmpeg
          cp src-tauri/binaries/ffprobe squashfs-root/usr/bin/ffprobe
          chmod +x squashfs-root/usr/bin/ffmpeg squashfs-root/usr/bin/ffprobe

          mv squashfs-root/AppRun squashfs-root/AppRun.real
          chmod +x squashfs-root/AppRun.real
          printf '#!/bin/bash\nunset WAYLAND_DISPLAY\nexport GDK_BACKEND=x11\nexport WEBKIT_DISABLE_DMABUF_RENDERER=1\nAPPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"\nexport PATH="$APPDIR/usr/bin:$PATH"\nexec "$APPDIR/AppRun.real" "$@"\n' > squashfs-root/AppRun
          chmod +x squashfs-root/AppRun

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root TheFoundry_App-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TheFoundry-App-Linux
          path: TheFoundry_App-x86_64.AppImage
          retention-days: 30
