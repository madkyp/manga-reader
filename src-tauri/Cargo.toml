[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
# Activado en builds de producción — sin esto Tauri carga el dev server en lugar de los assets embebidos
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls"] }
scraper = "0.21"
regex = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"
printpdf = { version = "0.6", features = ["embedded_images"] }
image = { version = "0.24", features = ["webp", "jpeg", "png"] }
librqbit = { version = "8", features = ["http-api", "tracing-subscriber-utils"] }
urlencoding = "2"
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
tauri-plugin-single-instance = "2"
